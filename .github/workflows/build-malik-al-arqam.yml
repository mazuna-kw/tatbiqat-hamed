name: Build ملك الأرقام APK

on:
  workflow_dispatch:
  push:
    branches: [ "game/malik-al-arqam-starter" ]
    paths:
      - "games/malik-al-arqam/**"
      - ".github/workflows/build-malik-al-arqam.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p games/malik-al-arqam :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: malik-al-arqam-debug-apk
          path: games/malik-al-arqam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
